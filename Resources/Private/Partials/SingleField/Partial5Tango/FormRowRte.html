<div class="form-group display-data row">
	<f:render partial="FormErrorSingle" arguments="{property: property}"/>
	<label for="{property}" class="col-12 text-left">
		<f:if condition="{translationKey}">
			<f:then>
				<f:translate key="{translationKey}">{translationKey}</f:translate>
			</f:then>
			<f:else>
				{label}
			</f:else>
		</f:if>

		<f:if condition="{mandatory}">
			<span class="mandatory">*</span>
		</f:if>

	</label>
	<div class="col-12">
		<f:form.textarea class="form-control" property="{property}" id="{property}" cols="40" rows="15" />
	</div>
</div>

<f:comment>1. CSS korrekt über den direkten Pfad einbinden</f:comment>
<f:asset.css identifier="ckeditor5-css" href="EXT:jv_events/Resources/Public/JavaScript/ckeditor5/ckeditor5.css" />

<f:comment>1. Pfade als normale Fluid-Variablen auflösen</f:comment>
<f:variable name="ckeditorJsUri" value="{f:uri.resource(path: 'EXT:jv_events/Resources/Public/JavaScript/ckeditor5/ckeditor5.js')}" />
<f:variable name="ckeditorBaseUri" value="{f:uri.resource(path: 'EXT:jv_events/Resources/Public/JavaScript/ckeditor5/')}" />

<f:comment>2. Struktur als Fluid-Array definieren und zu JSON konvertieren</f:comment>
<f:variable name="importMapData" value="{
    imports: {
        ckeditor5: ckeditorJsUri,
        'ckeditor5/': ckeditorBaseUri
    }
}" />

<script type="importmap">
	<f:format.raw><f:format.json>{importMapData}</f:format.json></f:format.raw>
</script>
<script type="module">
	import {
		ClassicEditor,
		Essentials,
		Paragraph,
		Heading,
		Bold,
		Strikethrough,
		RemoveFormat,
		HorizontalLine,
		List,
		Link,
		Alignment,
		SpecialCharacters,
		SpecialCharactersEssentials,
		SelectAll
	} from 'ckeditor5';

	ClassicEditor
			.create( document.querySelector( '#{property}' ), {
				licenseKey: 'GPL',
				plugins: [
					Essentials,
					Paragraph,
					Heading,
					Bold,
					Strikethrough,
					RemoveFormat,
					List,
					Link,
					Alignment,
					SpecialCharacters,
					SelectAll,
					HorizontalLine,
					SpecialCharactersEssentials
				],
				heading: {
					options: [
						{ model: 'paragraph', title: 'Absatz', class: 'ck-heading_paragraph' },
						{ model: 'heading2', view: 'h2', title: 'Überschrift 2', class: 'ck-heading_heading2' },
						{ model: 'heading3', view: 'h3', title: 'Überschrift 3', class: 'ck-heading_heading3' },
						{ model: 'formatted', view: 'pre', title: 'Formatiert', class: 'ck-heading_formatted' }
					]
				},
				toolbar: [
					'heading',

					'|',
					'undo', 'redo',
					'|',
					'bold', 'strikethrough', 'removeFormat',
					'|',
					'bulletedList',
					'|',
					'link',
					'|',
					'alignment',
					'|',
					'horizontalLine',
					'specialCharacters',
					'|',
					'selectAll'
				]
			} )
			.then( editor => {
				window.editor = editor;
			} )
			.catch( error => {
				console.error( 'CKEditor5 Init Error:', error );
			} );

</script>
