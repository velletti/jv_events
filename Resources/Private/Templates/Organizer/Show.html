{namespace v=FluidTYPO3\Vhs\ViewHelpers}
<f:layout name="Default" />

<f:section name="main">

  <f:if condition="{settings.LayoutList}">
    <f:then>
      <f:variable name="layoutList">{settings.LayoutList}</f:variable>
    </f:then>
    <f:else>
      <f:variable name="layoutList">5Tango</f:variable>
    </f:else>
  </f:if>

<f:flashMessages />

  <f:render partial="Organizer/Single/Partial{layoutList}/Header" arguments="{organizer:organizer, locations: locations, settings: settings}" />
  <f:render partial="Organizer/List/Partial{layoutList}/SingleOrganizer" arguments="{organizer:organizer, locations: locations, settings: settings, showDetails: '1' , nextEventOrganizer: nextEventOrganizer}" />

  <f:if condition="{locations}">
    <f:then>

      <div class="py-2">
        <div id="map" style="height:500px;"
             data-lat="{location.0.lat}"
             data-default-lat="{settings.map.defaultPosition.lat}"
             data-default-lng="{settings.map.defaultPosition.lng}"
             data-lng="{location.0..lng}"
             data-maptab='a[href="#jv_events_map"]'
             data-glat="48.1148263" data-glog="11.4712236"
             data-copy="&copy; <a target='_blank' href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors"
             data-geocodebase="false"
             data-geocodeoptions="false"
             style="width:100%;min-height:300px;"
        ></div>
        <v:page.header.link rel="dns-prefetch" href="https://nominatim.openstreetmap.org" />
        <v:page.header.link rel="preconnect" href="https://nominatim.openstreetmap.org" />
        <f:asset.script identifier="leaflet1" src="EXT:jv_events/Resources/Public/JavaScript/leaflet-1-7-1.js" priority="true" />
        <f:asset.script identifier="leafletLocation" src="EXT:jv_events/Resources/Public/JavaScript/tango/LeafletLocationMap.js" />

        <f:asset.css identifier="leaflet3" href="EXT:jv_events/Resources/Public/Css/leaflet-1-7-1.css" priority="true" />
        <f:asset.css identifier="leaflet4" href="EXT:jv_events/Resources/Public/Css/tango/leafletFrontend.css" />
      </div>

      <div id="jv_events_location_list">
        <f:for each="{locations}" as="location">
          <f:render partial="Location/List/Partial{layoutList}/SingleLocation" arguments="{location:location, settings: settings }" />
        </f:for>
      </div>

    </f:then>
  </f:if>
</f:section>
